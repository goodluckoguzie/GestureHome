<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <style>
      .title { font-size: 22px; font-weight: 700; fill: #1a1a2e; }
      .subtitle { font-size: 13px; fill: #4a5568; }
      .label { font-size: 12px; fill: #1a1a2e; font-weight: 600; }
      .small { font-size: 11px; fill: #4a5568; }
      .pin { font-size: 11px; fill: #0f766e; font-weight: 700; }
      .wire { stroke: #2563eb; stroke-width: 2; fill: none; }
      .wire-alt { stroke: #7c3aed; stroke-width: 2; fill: none; }
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; }
      .shield { fill: #e2e8f0; stroke: #1e293b; stroke-width: 2.5; }
      .module { fill: #fff; stroke: #475569; stroke-width: 1.5; }
      .pos { font-size: 10px; fill: #b45309; font-weight: 700; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <text x="40" y="36" class="title">KS0085 Smart Home wiring (sensor shield)</text>
  <text x="40" y="56" class="subtitle">Plug each module G/V/S (or GND/VCC/signal) into the matching shield row. Pins are Arduino digital pins.</text>

  <rect x="40" y="88" width="150" height="90" rx="8" class="box"/>
  <text x="58" y="118" class="label">Laptop</text>
  <text x="58" y="138" class="small">home_controller.py</text>
  <text x="58" y="154" class="small">webcam + MediaPipe</text>
  <text x="58" y="170" class="small">USB serial 9600 baud</text>

  <line x1="210" y1="133" x2="280" y2="133" class="wire" marker-end="url(#arrow)"/>
  <text x="218" y="125" class="small">USB</text>

  <rect x="280" y="72" width="420" height="130" rx="10" class="shield"/>
  <text x="300" y="98" class="label">Keyestudio PLUS (Arduino UNO)</text>
  <text x="300" y="118" class="small">+ sensor shield stacked on top</text>

  <rect x="300" y="128" width="380" height="56" rx="6" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
  <text x="312" y="152" class="small">Shield row: G  V  D2  D3  D5  D6  D7  D9  D13  SDA  SCL</text>
  <text x="312" y="168" class="small">Use GND/G and 5V/V on the same row as each signal pin</text>

  <rect x="720" y="72" width="240" height="200" rx="12" class="box" stroke-dasharray="6 4"/>
  <text x="738" y="98" class="label">Wooden smart home model</text>
  <text x="738" y="118" class="small">Numbered slots on the base</text>
  <text x="738" y="140" class="pos">slot 1: white LED</text>
  <text x="738" y="158" class="pos">slot 2: LCD (I2C)</text>
  <text x="738" y="176" class="pos">slot 12: yellow LED</text>
  <text x="738" y="194" class="pos">slot 15: fan driver</text>
  <text x="738" y="212" class="small">+ door servo, buzzer, PIR</text>

  <line x1="700" y1="133" x2="720" y2="133" class="wire-alt" stroke-dasharray="4 3"/>

  <rect x="40" y="240" width="200" height="72" rx="8" class="module"/>
  <text x="56" y="264" class="label">White LED module</text>
  <text x="56" y="282" class="pos">House slot 1</text>
  <text x="56" y="300" class="small">3-pin: G, V, S</text>
  <text x="130" y="300" class="pin">-&gt; D13</text>
  <path d="M240 276 L320 176" class="wire"/>

  <rect x="40" y="330" width="200" height="72" rx="8" class="module"/>
  <text x="56" y="354" class="label">Yellow LED module</text>
  <text x="56" y="372" class="pos">House slot 12</text>
  <text x="56" y="390" class="small">3-pin: G, V, S</text>
  <text x="130" y="390" class="pin">-&gt; D5</text>
  <path d="M240 366 L360 184" class="wire"/>

  <rect x="40" y="420" width="200" height="72" rx="8" class="module"/>
  <text x="56" y="442" class="label">PIR motion sensor</text>
  <text x="56" y="460" class="small">3-pin: G, V, S</text>
  <text x="130" y="460" class="pin">-&gt; D2</text>
  <text x="56" y="478" class="small">Alarm when security armed</text>
  <path d="M240 456 L340 184" class="wire"/>

  <rect x="280" y="240" width="200" height="72" rx="8" class="module"/>
  <text x="296" y="264" class="label">Buzzer module</text>
  <text x="296" y="282" class="small">3-pin: G, V, S</text>
  <text x="296" y="300" class="pin">-&gt; D3 (tones + alarm)</text>
  <path d="M480 276 L440 184" class="wire"/>

  <rect x="280" y="330" width="200" height="88" rx="8" class="module"/>
  <text x="296" y="354" class="label">Fan module</text>
  <text x="296" y="372" class="pos">House slot 15</text>
  <text x="296" y="390" class="small">4-pin: GND, VCC, INA, INB</text>
  <text x="296" y="406" class="pin">INA -&gt; D7, INB -&gt; D6</text>
  <path d="M480 374 L500 184" class="wire"/>

  <rect x="280" y="430" width="200" height="72" rx="8" class="module"/>
  <text x="296" y="454" class="label">Door servo</text>
  <text x="296" y="472" class="small">Signal wire (orange/yellow)</text>
  <text x="296" y="490" class="pin">-&gt; D9</text>
  <path d="M480 466 L520 184" class="wire"/>

  <rect x="540" y="240" width="220" height="88" rx="8" class="module"/>
  <text x="556" y="264" class="label">LCD1602 (I2C backpack)</text>
  <text x="556" y="282" class="pos">House slot 2</text>
  <text x="556" y="300" class="small">4-pin: GND, VCC, SDA, SCL</text>
  <text x="556" y="316" class="pin">SDA/A4, SCL/A5 (addr 0x27)</text>
  <path d="M740 284 L620 184" class="wire-alt"/>

  <rect x="540" y="370" width="420" height="110" rx="10" class="box"/>
  <text x="556" y="398" class="label">Software on the laptop (main files)</text>
  <text x="556" y="422" class="small">home_controller.py: camera, gestures, serial</text>
  <text x="556" y="442" class="small">gesture_home.ino: drives all modules on the board</text>
  <text x="556" y="458" class="small">ks0085_pins.h: pin map (edit if you rewire)</text>
  <text x="556" y="478" class="small">Close Arduino Serial Monitor before running Python.</text>

  <rect x="40" y="520" width="900" height="180" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="56" y="548" class="label">Pin reference (ks0085_pins.h)</text>

  <text x="56" y="576" class="small">D13 white LED</text>
  <text x="200" y="576" class="small">D5 yellow LED</text>
  <text x="340" y="576" class="small">D3 buzzer</text>
  <text x="480" y="576" class="small">D2 PIR input</text>
  <text x="620" y="576" class="small">D7 fan INA</text>
  <text x="760" y="576" class="small">D6 fan INB</text>

  <text x="56" y="602" class="small">D9 door servo</text>
  <text x="200" y="602" class="small">SDA LCD (A4)</text>
  <text x="340" y="602" class="small">SCL LCD (A5)</text>
  <text x="480" y="602" class="small">A0 gas (optional)</text>
  <text x="620" y="602" class="small">A1 steam (optional)</text>
  <text x="760" y="602" class="small">A2 photocell (optional)</text>

  <text x="56" y="634" class="small">Official kit docs:</text>
  <text x="170" y="634" class="pin">docs.keyestudio.com/projects/KS0085/</text>
  <text x="56" y="658" class="small">Wire G to GND, V to 5V. Double-check each module before power on.</text>
</svg>
