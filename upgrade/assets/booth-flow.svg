<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <style>
      .title { font-size: 20px; font-weight: 700; fill: #1a1a2e; }
      .label { font-size: 13px; fill: #1e293b; font-weight: 600; }
      .small { font-size: 11px; fill: #475569; }
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; }
      .phone { fill: #0f172a; stroke: #61d4c3; stroke-width: 2; }
      .screen { fill: #111827; }
      .proj { fill: #1e293b; stroke: #94a3b8; stroke-width: 2; }
      .laptop { fill: #e2e8f0; stroke: #475569; stroke-width: 2; }
      .house { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
      .arrow { stroke: #2563eb; stroke-width: 2.5; fill: none; marker-end: url(#arr); }
      .arrow2 { stroke: #7c3aed; stroke-width: 2.5; fill: none; marker-end: url(#arr2); }
    </style>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <text x="40" y="36" class="title">GestureHome booth: audience controls the real house</text>
  <text x="40" y="58" class="small">Same Wi-Fi. Phones use https:// and the projector QR.</text>

  <!-- Projector -->
  <rect x="40" y="90" width="280" height="160" rx="12" class="proj"/>
  <text x="56" y="118" class="label">Projector / big screen</text>
  <text x="56" y="138" class="small">host.html</text>
  <rect x="56" y="150" width="88" height="88" rx="6" fill="#fff" stroke="#cbd5e1"/>
  <text x="68" y="200" class="small" font-size="10">QR</text>
  <rect x="152" y="150" width="120" height="88" rx="6" class="screen"/>
  <text x="162" y="178" fill="#61d4c3" font-size="10">Live status</text>
  <text x="162" y="196" fill="#9ca3af" font-size="9">Light ON</text>
  <text x="162" y="212" fill="#9ca3af" font-size="9">Fan 2</text>
  <text x="162" y="228" fill="#9ca3af" font-size="9">Cheat sheet</text>

  <!-- Phone -->
  <rect x="360" y="100" width="120" height="220" rx="16" class="phone"/>
  <rect x="372" y="118" width="96" height="160" rx="4" class="screen"/>
  <text x="382" y="145" fill="#61d4c3" font-size="9">booth.html</text>
  <text x="382" y="165" fill="#9ca3af" font-size="8">neon hands</text>
  <text x="382" y="180" fill="#9ca3af" font-size="8">fist 3s</text>
  <text x="382" y="195" fill="#9ca3af" font-size="8">lights ON</text>
  <circle cx="420" cy="268" r="10" fill="#334155"/>
  <text x="356" y="248" class="label">Audience phone</text>

  <!-- Laptop -->
  <rect x="540" y="120" width="200" height="120" rx="10" class="laptop"/>
  <text x="556" y="148" class="label">Laptop</text>
  <text x="556" y="168" class="small">booth_bridge.py</text>
  <text x="556" y="186" class="small">HTTPS :8090</text>
  <text x="556" y="202" class="small">USB serial</text>
  <path d="M540 200 L520 200" class="arrow2"/>

  <!-- House -->
  <rect x="760" y="100" width="200" height="180" rx="12" class="house"/>
  <text x="776" y="128" class="label">Keyestudio house</text>
  <text x="776" y="148" class="small">gesture_home.ino</text>
  <rect x="790" y="160" width="24" height="24" fill="#fef08a" stroke="#ca8a04"/>
  <text x="818" y="178" class="small">LED</text>
  <rect x="850" y="160" width="40" height="24" fill="#93c5fd" stroke="#2563eb"/>
  <text x="856" y="178" class="small" font-size="9">LCD</text>
  <ellipse cx="810" cy="220" rx="28" ry="8" fill="#cbd5e1" stroke="#64748b"/>
  <text x="776" y="250" class="small">fan, door, buzzer, PIR</text>

  <!-- Arrows -->
  <path d="M320 170 L360 180" class="arrow"/>
  <text x="318" y="158" class="small">scan QR</text>
  <path d="M480 210 L540 180" class="arrow"/>
  <text x="488" y="198" class="small">gesture</text>
  <path d="M660 180 L760 190" class="arrow2"/>
  <text x="668" y="168" class="small">serial</text>

  <!-- Steps -->
  <rect x="40" y="320" width="880" height="180" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="56" y="352" class="label">Setup in 4 steps</text>
  <text x="56" y="380" class="small">1. Plug house USB to laptop, upload firmware from main if needed</text>
  <text x="56" y="400" class="small">2. Run ./upgrade/run_booth.sh (HTTPS on port 8090)</text>
  <text x="56" y="420" class="small">3. Show host.html on projector; audience scans QR</text>
  <text x="56" y="440" class="small">4. iPhone: accept certificate, Start camera, hold gestures</text>
  <text x="56" y="468" class="small" fill="#0f766e">Tip: one person at a time, about 30 seconds each</text>
</svg>
