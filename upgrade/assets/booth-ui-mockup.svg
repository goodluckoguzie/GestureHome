<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <style>
      .h { font-size: 14px; font-weight: 700; fill: #61d4c3; }
      .t { font-size: 11px; fill: #9ca3af; }
      .bg { fill: #050510; }
      .card { fill: #0c1220; stroke: rgba(255,255,255,0.12); stroke-width: 1.5; }
    </style>
  </defs>
  <text x="40" y="32" fill="#fff" font-size="18" font-weight="700">What each screen looks like</text>

  <!-- Host mock -->
  <rect x="40" y="50" width="400" height="300" rx="14" class="card"/>
  <text x="56" y="78" class="h">Projector: host.html</text>
  <rect x="56" y="92" width="120" height="120" rx="8" fill="#fff"/>
  <text x="86" y="155" fill="#333" font-size="10">QR code</text>
  <rect x="180" y="92" width="200" height="56" rx="6" fill="#111"/>
  <text x="192" y="112" class="t">USB OK  Light ON</text>
  <text x="192" y="128" class="t">Fan 0  Door CLOSE</text>
  <rect x="180" y="152" width="200" height="100" rx="6" fill="#111"/>
  <text x="192" y="172" class="t">fist 3s -&gt; lights ON</text>
  <text x="192" y="188" class="t">open palm -&gt; lights OFF</text>
  <text x="192" y="204" class="t">2 fists -&gt; door</text>
  <text x="192" y="220" class="t">https://192.168.x.x:8090/booth.html</text>

  <!-- Booth mock -->
  <rect x="460" y="50" width="200" height="300" rx="24" fill="#0f172a" stroke="#61d4c3" stroke-width="2"/>
  <text x="476" y="78" class="h">Phone: booth.html</text>
  <rect x="476" y="92" width="168" height="200" rx="6" class="bg"/>
  <line x1="500" y1="140" x2="560" y2="200" stroke="#f472b6" stroke-width="3"/>
  <line x1="560" y1="200" x2="620" y2="160" stroke="#38bdf8" stroke-width="3"/>
  <line x1="520" y1="220" x2="580" y2="260" stroke="#a78bfa" stroke-width="3"/>
  <text x="476" y="310" class="t">Neon hand tracking</text>
  <text x="476" y="326" class="t">Hold fist 2.1s / 3.0s</text>
  <rect x="500" y="336" width="140" height="28" rx="14" fill="#61d4c3"/>
  <text x="530" y="354" fill="#000" font-size="11" font-weight="600">Start camera</text>
</svg>
